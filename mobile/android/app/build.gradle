apply plugin: 'com.android.application'

android {
    namespace "online.knight.mobile"
    compileSdkVersion 34
    ndkVersion "27.2.12479018"
    defaultConfig {
        applicationId "online.knight.mobile"
        minSdkVersion 24          // OpenGL ES 3.0 + iconv (API 28 için) — 24 ile ES3 garanti
        targetSdkVersion 34
        versionCode 1
        versionName "0.1"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared", "-DANDROID_PLATFORM=android-24", "-DCMAKE_BUILD_TYPE=Release"
                cppFlags "-std=c++20 -frtti -fexceptions"
                abiFilters 'arm64-v8a', 'x86_64'   // telefon (ARM) + emülatör (x86_64)
            }
        }
    }
    // Her CI derlemesinin aynı anahtarla imzalanması için depodaki sabit debug anahtarı
    // (yoksa "yeni APK eskisinin üzerine kurulmuyor" hatası çıkıyor).
    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path '../jni/CMakeLists.txt'
            version "3.31.6"
        }
    }
    lint {
        abortOnError false
    }
}
