apply plugin: 'com.android.application'

android {
    namespace "online.knight.mobile"
    compileSdkVersion 34
    ndkVersion "27.2.12479018"
    defaultConfig {
        applicationId "online.knight.mobile"
        minSdkVersion 24          // OpenGL ES 3.0 + iconv (API 28 için) — 24 ile ES3 garanti
        targetSdkVersion 34
        versionCode 1
        versionName "0.1"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared", "-DANDROID_PLATFORM=android-24", "-DCMAKE_BUILD_TYPE=Release"
                cppFlags "-std=c++20 -frtti -fexceptions"
                abiFilters 'arm64-v8a'   // ilk hedef; 'armeabi-v7a', 'x86_64' eklenebilir
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path '../jni/CMakeLists.txt'
            version "3.22.1"
        }
    }
    lint {
        abortOnError false
    }
}
